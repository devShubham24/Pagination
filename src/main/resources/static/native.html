<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        select {
            padding: 5px;
        }

        /* Styling for page info */
        .page-info {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee List</h2>
    
    <div>
        <label for="pageSize">Items per page:</label>
        <select id="pageSize" onchange="fetchEmployees(0)">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody id="employeeTableBody">
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
        <span id="pageDetails">Page 1 of 10 | Total Items: 50</span>
        <button id="nextBtn" onclick="changePage(1)">Next</button>
    </div>
</div>

<script>
    let currentPage = 0;
    let totalPages = 0;
    let totalRecords = 0;

    async function fetchEmployees(page) {
        const pageSize = document.getElementById("pageSize").value;
        const url = `http://localhost:8080/employees/${page}/${pageSize}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            totalRecords = data.totalRecords;
            totalPages = Math.ceil(totalRecords / pageSize);

            const tableBody = document.getElementById("employeeTableBody");
            tableBody.innerHTML = ""; // Clear old data

            data.employees.forEach(emp => {
                const row = `<tr>
                                <td>${emp.id}</td>
                                <td>${emp.name}</td>
                                <td>${emp.department}</td>
                                <td>${emp.salary}</td>
                            </tr>`;
                tableBody.innerHTML += row;
            });

            // Update pagination details
            currentPage = page;
            document.getElementById("pageDetails").innerText = `Page ${currentPage + 1} of ${totalPages} | Total Items: ${totalRecords}`;

            // Enable/Disable buttons
            document.getElementById("prevBtn").disabled = currentPage === 0;
            document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;

        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    function changePage(step) {
        fetchEmployees(currentPage + step);
    }

    // Load initial data
    fetchEmployees(0);
</script>

</body>
</html>
